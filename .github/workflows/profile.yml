name: Update profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Both steps write into dist/, so they must stay in a single job: a second
      # workflow pushing the same output branch would race this one.
      # light: audio VU meter, green to red, synth-purple snake
      # dark: F1 night-race brake glow, dark to hot orange, F1-red snake
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23a371f7&color_dots=%23ebedf0,%239be9a8,%232ea043,%23e3b341,%23f85149
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2322d3ee&color_dots=%230d1117,%231e1b4b,%236d28d9,%23c026d3,%23f0abfc

      - name: Generate profile cards
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node .github/scripts/build-profile-cards.mjs > dist/card.log 2>&1; then
            cat dist/card.log
          else
            {
              echo "node: $(command -v node) $(node -v 2>&1)"
              echo "pwd: $(pwd)"
              echo "script: $(ls -l .github/scripts/ 2>&1)"
              echo "dist: $(ls -l dist/ 2>&1)"
              echo "--- node output ---"
              cat dist/card.log
            } >> dist/card.log
            cat dist/card.log
            exit 1
          fi

      - name: Push to output branch
        if: always()
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
