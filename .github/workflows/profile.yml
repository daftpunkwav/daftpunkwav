name: Update profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Public repositories are not checked out automatically, and the card
      # script lives in this repository. Both steps below write into dist/, so
      # they must stay in a single job: a second workflow pushing the same
      # output branch would race this one.
      - name: Check out repository
        uses: actions/checkout@v4

      # colour_dots is level 0 (empty) first, then levels 1-4, so the snake only
      # ever has to stay clear of the four activity colours. Most weeks are empty
      # and level 1 dwarfs 2-4, so the empty and level-1 colours are what carry
      # the theme; levels 3-4 are almost never reached.
      # light: cyberpunk — cyan to fuchsia activity, hot-pink snake
      # dark: synthwave — magenta to neon-yellow sunset, cyan snake
      # soft dark reuses the dark SVG: a README <picture> only takes media
      # queries, and GitHub strips <style>, so dark_dimmed cannot be targeted.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23db2777&color_dots=%23e2e8f2,%230891b2,%232563eb,%239333ea,%23c026d3
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300f5d4&color_dots=%23352573,%23a21caf,%23ff2e97,%23ffb347,%23f9f71d

      - name: Generate profile cards
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # voyager-beta commits ~416 MB of vendored C, which otherwise makes the
          # language card 93% "C" and tells nobody anything.
          EXCLUDE_REPOS: voyager-beta
        run: node .github/scripts/build-profile-cards.mjs

      # Keep the snake publishing even if card generation fails; the job still
      # reports the failure.
      - name: Push to output branch
        if: always()
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
